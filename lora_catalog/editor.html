<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoRA Card Editor</title>
<style>
:root {
  --bg:#f6f4ef; --panel:#ffffff; --fg:#1f1f1d; --muted:#7a776f; --line:#e2ded4; --soft:#efece4;
  --accent:#2f5d8a; --accent-fg:#ffffff; --accent-soft:#dde7f2; --warn:#a85a14; --good:#2e7d4f; --new:#7a4fa0; --star:#d39a12;
}
@media (prefers-color-scheme: dark) {
  :root { --bg:#151617; --panel:#1e2022; --fg:#e8e6e1; --muted:#9a978f; --line:#33363a; --soft:#26292c;
          --accent:#7fa8d6; --accent-fg:#10161d; --accent-soft:#24364a; --warn:#e0a060; --good:#6cc28f; --new:#b99be0; --star:#f0c050; }
}
* { box-sizing:border-box; }
html, body { height:100%; }
body { margin:0; background:var(--bg); color:var(--fg); font:14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input, textarea { font:inherit; color:inherit; }
.muted { color:var(--muted); }
header { display:flex; gap:10px; align-items:center; flex-wrap:wrap; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel); position:sticky; top:0; z-index:5; }
header h1 { font-size:15px; margin:0 8px 0 0; letter-spacing:.2px; }
header select { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:4px 6px; }
header .progress { color:var(--muted); margin-left:auto; }
header .keys { color:var(--muted); font-size:12px; }
header .search input { width:230px; background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
header .search input:focus { outline:none; border-color:var(--accent); background:var(--panel); }
aside .found { padding:6px 12px; font-size:12px; color:var(--muted); border-bottom:1px solid var(--line); background:var(--soft); }
aside .found a { color:var(--accent); cursor:pointer; }
aside .item small.f { max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* folder panel (organise.py) */
header button.fold { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
header button.fold.on { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
body.folders-on .layout { grid-template-columns:250px 270px 1fr; }
#folders { display:none; }
body.folders-on #folders { display:block; }
#folders .tools { position:sticky; top:0; background:var(--panel); padding:8px 10px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:6px; z-index:2; }
#folders .tools button, .modal button { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:3px 9px; cursor:pointer; font-size:12px; }
#folders .tools button:disabled { opacity:.45; cursor:default; }
#folders .tools .sel { width:100%; font-size:12px; color:var(--muted); }
#folders .f { padding:4px 10px; cursor:pointer; display:flex; gap:6px; align-items:center; font-size:13px; border-bottom:1px solid var(--soft); }
#folders .f:hover { background:var(--soft); }
#folders .f.on { background:var(--accent-soft); font-weight:600; }
#folders .f .nm { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#folders .f small { color:var(--muted); }
#folders .f .here { display:none; font-size:11px; border:1px solid var(--accent); color:var(--accent); border-radius:5px; padding:0 6px; background:none; cursor:pointer; }
body.selecting #folders .f:hover .here { display:inline-block; }
aside .item .ck { margin:0; display:none; }
body.folders-on aside .item .ck { display:inline-block; }
aside .item.sel { box-shadow:inset 3px 0 0 var(--accent); }
aside .item.grp { border-top:2px solid var(--line); }
body.dupes aside .item small.f { max-width:130px; }
#folders .tools button.danger { color:var(--warn); border-color:var(--warn); }
.modal-back { position:fixed; inset:0; background:rgba(0,0,0,.45); display:none; align-items:center; justify-content:center; z-index:30; }
.modal-back.on { display:flex; }
.modal { background:var(--panel); border:1px solid var(--line); border-radius:10px; width:min(760px, 94vw); max-height:86vh; overflow:auto; padding:16px 20px; }
.modal h3 { margin:0 0 8px; font-size:16px; }
.modal .row { display:flex; gap:8px; align-items:center; margin:10px 0; flex-wrap:wrap; }
.modal input[type=text] { flex:1; min-width:260px; background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
.modal button.go { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-size:13px; padding:5px 14px; }
.modal .warn { color:var(--warn); } .modal .good { color:var(--good); }
.modal ul { margin:6px 0; padding-left:20px; font-size:12px; }
.modal li { overflow-wrap:anywhere; }
.modal details { margin:8px 0; font-size:12px; } .modal summary { cursor:pointer; color:var(--muted); }
.modal .ops { font:11px/1.5 ui-monospace, Consolas, monospace; white-space:pre-wrap; overflow-wrap:anywhere; color:var(--muted); }
.modal table { border-collapse:collapse; width:100%; font-size:12px; } .modal td { padding:4px 6px; border-bottom:1px solid var(--soft); }
.layout { display:grid; grid-template-columns:270px 1fr; height:calc(100% - 47px); }
aside { border-right:1px solid var(--line); overflow:auto; background:var(--panel); }
aside .item { padding:7px 12px; border-bottom:1px solid var(--soft); cursor:pointer; display:flex; gap:8px; align-items:center; }
aside .item:hover { background:var(--soft); }
aside .item.on { background:var(--accent-soft); }
aside .item .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
aside .item small { color:var(--muted); }
aside .item .st { color:var(--star); font-size:12px; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--line); flex:none; }
.dot.confirmed { background:var(--good); } .dot.edited { background:var(--accent); } .dot.unsure { background:var(--warn); }
main { overflow:auto; padding:14px 18px 90px; }
.empty { color:var(--muted); padding:40px; text-align:center; }

/* card: left pane (title, images, what the model says) | two input columns. Proportional, so it uses wide screens. */
.card { display:grid; grid-template-columns:minmax(360px, 2fr) minmax(0, 3fr); gap:20px; align-items:start; }
.left { min-width:0; }
.head { position:sticky; top:-14px; z-index:3; background:var(--bg); padding:14px 0 6px; margin-top:-14px; }
.cols { display:grid; grid-template-columns:repeat(auto-fit, minmax(300px, 1fr)); gap:14px; align-items:start; min-width:0; }
.col { min-width:0; }
@media (max-width: 1050px) { .card { grid-template-columns:1fr; } .head { position:static; margin-top:0; padding-top:0; } }

.title { display:flex; gap:10px; align-items:baseline; flex-wrap:wrap; }
.title h2 { margin:0; font-size:19px; }
.title .ver { color:var(--muted); }
.stars { margin-left:auto; user-select:none; white-space:nowrap; font-size:19px; letter-spacing:1px; }
.stars span { cursor:pointer; color:var(--line); }
.stars span.on { color:var(--star); }
.stars span:hover { color:var(--star); opacity:.7; }
.stars small { font-size:11px; color:var(--muted); margin-left:6px; letter-spacing:0; }
.stars small.sweepavg { color:var(--star); opacity:.8; cursor:help; }
.badges { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 6px; }
.badge { font-size:11px; border:1px solid var(--line); border-radius:10px; padding:1px 8px; color:var(--muted); }
.badge.warn { color:var(--warn); border-color:var(--warn); } .badge.good { color:var(--good); border-color:var(--good); }
.badge a { color:var(--accent); text-decoration:none; }
.file { font-size:12px; color:var(--muted); overflow-wrap:anywhere; cursor:copy; }

/* images: a 2x2 grid that pages when a LoRA has more than four */
.grid { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin:8px 0 4px; }
.grid .cell { aspect-ratio:1; max-height:30vh; background:var(--soft); border-radius:6px; overflow:hidden; display:flex; align-items:center; justify-content:center; }
.grid.one { grid-template-columns:1fr; }
.grid.one .cell { aspect-ratio:auto; height:auto; max-height:44vh; }
.grid img { max-width:100%; max-height:100%; width:auto; height:auto; object-fit:contain; cursor:zoom-in; display:block; }
.grid.one img { max-height:44vh; }
.pager { display:flex; gap:8px; align-items:center; justify-content:center; color:var(--muted); font-size:12px; margin-bottom:6px; }
.pager button { border:1px solid var(--line); background:var(--soft); border-radius:6px; padding:0 10px; cursor:pointer; }
.none { color:var(--muted); padding:20px; text-align:center; background:var(--soft); border-radius:6px; margin:8px 0; }

section.facet { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:9px 11px 10px; margin-bottom:9px; }
section.facet h3 { margin:0 0 6px; font-size:13px; display:flex; gap:8px; align-items:baseline; flex-wrap:wrap; }
section.facet h3 .help { font-weight:normal; color:var(--muted); font-size:12px; }
section.facet h3 .pick { font-weight:normal; color:var(--muted); font-size:11px; margin-left:auto; }
.chips { display:flex; flex-wrap:wrap; gap:5px; }
.chip { border:1px solid var(--line); background:var(--soft); border-radius:14px; padding:2px 10px; cursor:pointer; user-select:none; font-size:13px; }
.chip:hover { border-color:var(--accent); }
.chip.sel { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.chip.model:not(.sel) { border-style:dashed; border-color:var(--warn); }
.chip.group { font-weight:600; }
.chip.child { font-size:12px; }
.chip.free { border-color:var(--new); }
.chip.free.sel { background:var(--new); border-color:var(--new); }
.chip .x { margin-left:6px; opacity:.7; }
.chip .more { margin-left:5px; opacity:.6; font-size:11px; }
.chip .mk { margin-left:6px; font-weight:700; opacity:.85; }
.chip .mk:hover { opacity:1; text-decoration:underline; }
.promote { margin-top:7px; padding:6px 8px; border:1px dashed var(--new); border-radius:6px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px; }
.promote select, .promote button { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:2px 8px; cursor:pointer; }
.promote button.go { background:var(--new); color:#fff; border-color:var(--new); }
.getciv { display:block; margin:4px auto 8px; border:1px solid var(--accent); color:var(--accent); background:var(--panel); border-radius:6px; padding:4px 12px; cursor:pointer; }
.getciv:disabled { opacity:.6; cursor:wait; }
.chip.trig.normal { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.chip.trig.priority { background:var(--good); color:var(--accent-fg); border-color:var(--good); font-weight:600; }
.chip.trig.off { text-decoration:line-through; opacity:.55; }
/* prompt words (2026-10-15) */
.pwnow { font-size:13px; margin:2px 0; } .pwnow.small { font-size:12px; color:var(--muted); }
.pwscope { margin:6px 0; font-size:13px; } .pwscope select { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:1px 6px; }
table.pw { width:100%; border-collapse:collapse; font-size:12.5px; margin-top:4px; }
table.pw td { border-top:1px solid var(--line); padding:4px 4px; vertical-align:top; }
table.pw td.sc { white-space:nowrap; color:var(--good); }
table.pw tr.on td { background:var(--soft); }
table.pw button, #pw_custom_go, #pw_clear { background:var(--soft); border:1px solid var(--line); border-radius:6px; padding:1px 8px; cursor:pointer; }
table.pw tr.on button { background:var(--good); color:var(--accent-fg); border-color:var(--good); }
input.trigedit { border:1px solid var(--accent); border-radius:14px; padding:1px 10px; background:var(--bg); font-size:13px; min-width:120px; }
.addbox { margin-top:6px; display:flex; gap:6px; }
.addbox input { flex:1; min-width:0; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 8px; font-size:13px; }
h2.group { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin:4px 0 6px; padding-top:6px; }
section.facet.closed { padding:6px 11px; }
section.facet.closed h3 { margin:0; }
section.facet h3.toggle { cursor:pointer; }
section.facet h3 .tw { color:var(--muted); width:12px; display:inline-block; }
.legend { font-size:12px; color:var(--muted); margin:2px 0 10px; }
.legend .chip { cursor:default; font-size:11px; padding:0 7px; }
.look { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px; margin-bottom:9px; }
.look .lab { font-size:12px; text-transform:uppercase; letter-spacing:.8px; color:var(--muted); margin-right:8px; }

.evidence { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; margin-top:4px; }
.evidence h4 { margin:10px 0 3px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; }
.evidence h4:first-child { margin-top:0; }
.evidence p { margin:0 0 4px; }
.evidence .prompt { border-left:3px solid var(--line); padding-left:8px; margin:4px 0; color:var(--fg); }
.evidence dl { display:grid; grid-template-columns:72px 1fr; gap:2px 8px; margin:0; }
.evidence dt { color:var(--muted); } .evidence dd { margin:0; overflow-wrap:anywhere; }
.evidence details summary { cursor:pointer; color:var(--muted); }
code { background:var(--soft); padding:0 4px; border-radius:3px; }
.row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.wts label { display:flex; gap:5px; align-items:center; color:var(--muted); font-size:12px; }
.wts input { width:78px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 6px; color:var(--fg); font-size:14px; }
.wbar { margin:8px 0 2px; }
.wbar .track { position:relative; height:16px; background:var(--soft); border-radius:8px; }
.wbar .band { position:absolute; border-radius:5px; }
.wbar .band.model { top:1px; height:14px; border:1.5px dashed var(--warn); }
.wbar .band.mine { top:4px; height:8px; background:var(--accent); opacity:.75; }
.wbar .band.comm { top:12px; height:4px; background:var(--good); opacity:.85; }
.wbar .ctick { position:absolute; top:10px; width:2px; margin-left:-1px; height:8px; background:var(--good); }
/* Civitai audience (community.py) */
.aud { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 12px; font-size:13px; margin:8px 0 4px; }
.aud h4 { margin:0 0 4px; font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.5px; display:flex; gap:8px; align-items:center; }
.aud .big { font-size:20px; font-weight:600; color:var(--fg); letter-spacing:0; text-transform:none; }
.aud .nums { color:var(--muted); font-size:12px; margin:2px 0 6px; }
.aud .levels { display:flex; height:8px; border-radius:4px; overflow:hidden; margin:4px 0 2px; background:var(--soft); }
.aud .levels span { display:block; height:100%; }
.aud .tp { border-left:3px solid var(--line); padding:3px 0 3px 8px; margin:6px 0; }
.aud .tp.picked { border-left-color:var(--good); }
.aud .tp .meta { font-size:11px; color:var(--muted); display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.aud .tp .meta b { font-weight:600; }
.aud .tp button, .aud select, .aud .usew { font-size:11px; background:var(--soft); border:1px solid var(--line); border-radius:5px; padding:0 6px; cursor:pointer; }
.aud .lvl { border-radius:4px; padding:0 5px; font-size:10px; }
.aud .lvl.None { background:#2e7d4f22; } .aud .lvl.Soft { background:#d39a1222; } .aud .lvl.Mature { background:#a85a1433; } .aud .lvl.X { background:#b23b2e33; }
.aud .warnline { color:var(--warn); }
.aud .pcs { display:flex; flex-wrap:wrap; gap:4px 6px; align-items:center; font-size:12px; margin:0 0 6px; }
.aud .pc { border:1px solid var(--line); border-radius:10px; padding:0 7px; color:var(--muted); }
.aud .pc b { color:var(--fg); font-weight:600; }
.aud .pc.hi { border-color:var(--good); } .aud .pc.hi b { color:var(--good); }
.aud .pc.lo { border-color:var(--warn); }
.aud .tp .txt { display:-webkit-box; -webkit-line-clamp:4; -webkit-box-orient:vertical; overflow:hidden; cursor:pointer; }
.aud .tp .txt.open { display:block; }
.badge.score { color:var(--good); border-color:var(--good); }
.wbar .tick { position:absolute; top:-3px; width:3px; margin-left:-1px; height:22px; background:var(--fg); border-radius:2px; }
.wbar .zero { position:absolute; top:0; width:1px; height:16px; background:var(--muted); }
.wbar .scale { display:flex; justify-content:space-between; font-size:11px; color:var(--muted); margin-top:3px; }
.wkey { font-size:11px; color:var(--muted); }
.wkey i { display:inline-block; width:16px; height:8px; border-radius:3px; vertical-align:middle; margin:0 3px 0 8px; }
textarea { width:100%; min-height:48px; background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; resize:vertical; }
.suggest { position:relative; flex:1; }
.suggest ul { position:absolute; left:0; right:0; top:100%; margin:2px 0 0; padding:0; list-style:none; background:var(--panel); border:1px solid var(--line); border-radius:6px; z-index:10; max-height:230px; overflow:auto; }
.suggest li { padding:4px 8px; cursor:pointer; } .suggest li.on, .suggest li:hover { background:var(--accent-soft); }
body.folders-on footer { left:520px; }
footer { position:fixed; left:270px; right:0; bottom:0; display:flex; gap:8px; align-items:center; padding:9px 18px; background:var(--panel); border-top:1px solid var(--line); z-index:6; }
@media (max-width: 760px) { .layout { grid-template-columns:1fr; } aside { max-height:30vh; } footer { left:0; } }
footer button { border:1px solid var(--line); background:var(--soft); border-radius:6px; padding:6px 13px; cursor:pointer; }
footer button.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; }
footer button.unsure { color:var(--warn); border-color:var(--warn); }
footer .msg { color:var(--muted); margin-left:auto; font-size:13px; }
footer .msg.err { color:var(--warn); }
/* Discover (2026-10-29) */
body.discover footer #prev, body.discover footer #save, body.discover footer #unsure, body.discover footer #skip { display:none; }
aside .item small.ov { color:var(--warn); }
.disc { padding:18px 22px; max-width:1100px; }
.disc h2 { margin:0 0 8px; } .disc h2 small { color:var(--muted); font-weight:400; font-size:14px; }
.disc .badges { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:12px; }
.disc .badge.warn { color:var(--warn); border-color:var(--warn); }
.disc .why { margin:14px 0 6px; }
.disctbl { border-collapse:collapse; font-size:13px; }
.disctbl td, .disctbl th { padding:4px 10px; border-bottom:1px solid var(--soft); text-align:left; }
.disctbl th { color:var(--muted); font-weight:500; } .disctbl td.n { text-align:right; white-space:nowrap; }
.disc .discbtns { display:flex; gap:8px; margin:18px 0 8px; }
.disc .discbtns a.btn, .disc .discbtns button { border:1px solid var(--line); background:var(--soft); border-radius:6px; padding:6px 13px; cursor:pointer; color:inherit; text-decoration:none; font-size:14px; }
.disc .discbtns a.btn.primary { background:var(--accent); color:var(--accent-fg); border-color:var(--accent); }
.disc .small { font-size:12px; }
footer .dotkey { display:flex; gap:14px; align-items:center; font-size:12px; color:var(--muted); white-space:nowrap; }
footer .dotkey .k { display:inline-flex; align-items:center; gap:5px; cursor:help; }   /* 2026-10-28 dot colour key */
.overlay { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; align-items:center; justify-content:center; z-index:20; cursor:zoom-out; }
.overlay img { max-width:94vw; max-height:94vh; border-radius:6px; }
.overlay .count { position:fixed; bottom:14px; left:0; right:0; text-align:center; color:#ddd; font-size:13px; }
.overlay.on { display:flex; }
/* style search (style.py) */
#similar { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:8px 11px 10px; margin:8px 0 4px; }
#similar:empty { display:none; }
#similar .shead { display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:12px; color:var(--muted); margin-bottom:6px; }
#similar .shead b { font-size:12px; text-transform:uppercase; letter-spacing:.5px; }
#similar .shead .sp { margin-left:auto; display:flex; gap:5px; flex-wrap:wrap; }
#similar .tog { font-size:11px; background:var(--soft); border:1px solid var(--line); border-radius:10px; padding:0 8px; cursor:pointer; color:var(--muted); }
#similar .tog.on { border-color:var(--accent); color:var(--accent); }
#similar .strip { display:grid; grid-template-columns:repeat(auto-fill, minmax(92px, 1fr)); gap:7px; }
#similar .tile { cursor:pointer; font-size:11px; line-height:1.25; min-width:0; }
#similar .tile img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:5px; display:block; background:var(--soft); }
#similar .tile:hover img { outline:2px solid var(--accent); }
#similar .tile .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; margin-top:2px; }
#similar .tile .sc { color:var(--muted); }
#similar .note { font-size:12px; color:var(--warn); margin:2px 0 6px; }
#similar .note.plain { color:var(--muted); }
header .search.drop input { outline:2px dashed var(--accent); }
.imgchip img { height:26px; border-radius:3px; vertical-align:middle; margin:0 3px; }
.found.madewith a { margin-right:8px; white-space:nowrap; cursor:pointer; }
.found.madewith .notyours { color:var(--muted); }
.recgrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(230px, 1fr)); gap:8px 14px; margin:6px 0; }
.rectbl table { border-collapse:collapse; width:100%; font-size:12px; }
#recbox .warnline { color:var(--warn); }
#recbox .conf { border:1px solid var(--line); border-radius:8px; padding:0 6px; font-size:11px; }
#recbox .conf-solid { color:var(--good); border-color:var(--good); } #recbox .conf-early, #recbox .conf-none { color:var(--warn); border-color:var(--warn); }
#recbox > .small { margin:3px 0; }
#recbox .gtxt { color:var(--good); } #recbox .btxt { color:var(--bad); }
.rectbl td { padding:1px 4px; border-bottom:1px solid var(--line); }
.rectbl td.n { text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
.rectbl .gtxt { color:var(--good); } .rectbl .btxt { color:var(--bad); }
.offer { margin:4px 0; padding:4px 8px; border-left:3px solid var(--accent); background:var(--soft); font-size:12.5px; }
details.recipe { margin:6px 0 10px; }
details.recipe summary { cursor:pointer; font-weight:600; }
.rcp { margin:6px 0; }
.rcp label { display:block; font-size:12px; color:var(--muted); }
.rcp textarea { width:100%; box-sizing:border-box; font:12px/1.35 Consolas, monospace; }
</style>
</head>
<body>
<header>
  <h1>LoRA Card Editor</h1>
  <span class="search"><input id="q" type="search" placeholder="Search  ( / )" autocomplete="off" spellcheck="false"
    title="Find LoRAs by name, trigger, artist, tag or any words on the card.&#10;fashion photo - every word, each a prefix (photo finds photography)&#10;&quot;film noir&quot; - exact phrase&#10;-anime - leave out&#10;name:arcane  tag:poster  artist:mucha  creator:xyz  folder:graphic  notes:  card:  trigger:  description:&#10;The shelf, status and rating pickers still filter the results.&#10;Style search (when on):&#10;like:mignola - LoRAs that look like it, closest first (same base model; likeall: every base)&#10;Drop or paste an image here - LoRAs closest to its look"></span>
  <button class="fold" id="imgbtn" style="display:none" title="Find LoRAs by look: pick an image (or drop / paste one onto the search box). The list shows the LoRAs whose preview images are closest to its style.">By image</button>
  <input type="file" id="imgfile" accept="image/*" hidden>
  <select id="shelf" title="Shelf / category folder"></select>
  <select id="status" title="Which cards to list">
    <option value="todo">not reviewed</option><option value="unsure">unsure</option>
    <option value="edited">edited</option><option value="confirmed">confirmed</option><option value="all">all</option>
  </select>
  <select id="rating" title="Filter by your star rating">
    <option value="any">any rating</option><option value="unrated">unrated</option>
    <option value="low">★1-2 (cull?)</option><option value="high">★3 and up</option>
  </select>
  <select id="order" title="Order">
    <option value="priority">most useful first</option><option value="name">by name</option><option value="folder">by folder</option>
    <option value="rating">by rating</option>
  </select>
  <a href="/sweeps" title="Rate Eric_Krea2 sweep cells 1-5 stars with flaw / praise tags - which LoRAs and combinations work, on which checkpoint and prompt" style="color:var(--accent);font-size:13px">Sweeps</a>
  <button class="fold" id="dupbtn" title="List every LoRA that exists more than once (the same file in two places), copies side by side. Tick the copies to remove, then Delete… in the folder panel.">Duplicates</button>
  <button class="fold" id="looksbtn" style="display:none" title="Pairs of style LoRAs whose preview images look alike (same base model as the shelf), side by side - for culling near-copies of one look">Look-alikes</button>
  <button class="fold" id="discbtn" title="Discover: LoRAs you don't own that Civitai users stack with the LoRAs you rate highly, for the base model of the selected shelf">Discover</button>
  <button class="fold" id="foldbtn" title="Show the library folders: pick LoRAs with the checkboxes, then move them, or make / rename folders. Every change shows a plan first and can be undone.">Folders</button>
  <span class="keys">/ search · Enter save · U unsure · J/K next/prev · 1-4 image (←/→ in zoom) · Shift+1-5 rate, Shift+0 clear &middot; Esc close / leave the field</span>
  <span class="progress" id="progress"></span>
</header>
<div class="layout">
  <aside id="folders"></aside>
  <aside id="queue"></aside>
  <main id="main"><div class="empty">Loading...</div></main>
</div>
<footer>
  <button id="prev" title="K">← Prev</button>
  <button id="save" class="primary" title="Enter">Looks right ↵</button>
  <button id="unsure" class="unsure" title="U">Unsure</button>
  <button id="skip" title="J">Skip →</button>
  <span class="msg" id="msg"></span>
  <span class="dotkey"><span class="k" title="Not reviewed yet"><span class="dot"></span>not reviewed</span><span class="k" title="You saved the card with nothing changed from what the model wrote"><span class="dot confirmed"></span>confirmed</span><span class="k" title="You changed the card and saved it"><span class="dot edited"></span>edited</span><span class="k" title="You pressed Unsure (U)"><span class="dot unsure"></span>unsure</span></span>
</footer>
<div class="modal-back" id="modalback"><div class="modal" id="modal"></div></div>
<div class="overlay" id="overlay"><img id="big" alt=""><div class="count" id="bigcount"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let VOCAB = null, QUEUE = [], POS = -1, CARD = null, STATE = null, START = null;
let IMGPAGE = 0, ZOOM = -1, WARNED = null;
const PER_PAGE = 4;

async function api(url, body, signal) {
  const r = await fetch(url, body ? {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body), signal}
                                  : {signal});
  const data = await r.json().catch(() => ({error:"bad response"}));
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
}
function msg(text, err) { const m = $("#msg"); m.textContent = text; m.className = "msg" + (err ? " err" : ""); }
const remember = (k, v) => { try { localStorage.setItem("lce_" + k, v); } catch (e) {} };
const recall = k => { try { return localStorage.getItem("lce_" + k); } catch (e) { return null; } };

// ---------- queue ------------------------------------------------------------------------------------------
// The view the editor opens on comes from settings.json (editor_start_shelf / editor_start_status, default Krea2 +
// all), read once per page load; after that the pickers stay where you put them (2026-10-16).
let START_VIEW = null;
async function loadShelves() {
  const shelves = await api("/api/shelves");
  const sel = $("#shelf"), keep = sel.value;
  // each base-model folder as one entry (Krea2 = every folder under it), its shelves indented below it
  const arch = {};
  for (const s of shelves) {
    const a = s.shelf.split("/")[0]; if (!a) continue;
    arch[a] = arch[a] || {reviewed: 0, total: 0}; arch[a].reviewed += s.reviewed; arch[a].total += s.total;
  }
  let html = `<option value="">all shelves</option>`;
  for (const a of Object.keys(arch).sort((x, y) => x.toLowerCase().localeCompare(y.toLowerCase()))) {
    html += `<option value="${esc(a)}">${esc(a)} - all folders  (${arch[a].reviewed}/${arch[a].total})</option>`;
    html += shelves.filter(s => s.shelf.includes("/") && s.shelf.split("/")[0] === a).map(s =>
      `<option value="${esc(s.shelf)}">&nbsp;&nbsp;&nbsp;${esc(s.shelf)}  (${s.reviewed}/${s.total})</option>`).join("");
  }
  sel.innerHTML = html;
  const has = v => [...sel.options].some(o => o.value === v);
  let want = keep;
  if (START_VIEW === null) {
    try { START_VIEW = await api("/api/start"); } catch (e) { START_VIEW = {shelf: "Krea2", status: "all"}; }
    want = START_VIEW.shelf;
    $("#status").value = START_VIEW.status;
  }
  sel.value = want && has(want) ? want : "";
  const total = shelves.reduce((a, s) => a + s.total, 0), done = shelves.reduce((a, s) => a + s.reviewed, 0);
  $("#progress").textContent = `${done} / ${total} reviewed`;
  syncShelfSelect();
}
let FOUND = null;          // search summary {matched, hidden, mode} or null when not searching
let QUEUE_CTL = null;     // the list request in flight: a newer view cancels it instead of waiting behind it
async function loadQueue(keepPath) {
  if (DISC_ON) {                                     // Discover (2026-10-29): a search or image search leaves it
    if ($("#q").value.trim() || IMGQ) discoverOff(true); else return loadDiscover();
  }
  if (QUEUE_CTL) QUEUE_CTL.abort();
  const ctl = QUEUE_CTL = new AbortController();
  const q = $("#q").value.trim();
  const shelf = $("#shelf").value === "__folder__" ? "" : $("#shelf").value;
  const p = new URLSearchParams({shelf, status:$("#status").value, order:$("#order").value,
                                 rating:$("#rating").value, q, folder: FOLDER ? FOLDER.rel : ""});
  if (DUPES) p.set("dupes", "1");
  if (LOOKS) p.set("looks", "1");
  let data;
  try {
    data = IMGQ && !DUPES && !LOOKS ? await apiImage("/api/style_search?" + p, IMGQ.file) : await api("/api/queue?" + p, null, ctl.signal);
  } catch (e) { if (ctl.signal.aborted) return; throw e; }
  if (ctl !== QUEUE_CTL) return;          // a newer view was asked for meanwhile
  if (data.reason && (data.mode === "style-off" || data.looks)) msg("style search: " + data.reason, true);
  if (Array.isArray(data)) { QUEUE = data; FOUND = null; }
  else if (data.dupes || data.looks) { QUEUE = data.items; FOUND = null; }
  else { QUEUE = data.items; FOUND = data; }
  drawQueue();
  let i = keepPath ? QUEUE.findIndex(q => q.path === keepPath) : 0;
  if (i < 0) i = 0;
  if (QUEUE.length) open(i); else { POS = -1; CARD = null; $("#main").innerHTML = `<div class="empty">${FOUND ?
    (FOUND.matched ? `${FOUND.matched} LoRAs match, but the shelf / status / rating pickers hide them all.` : "Nothing matches that search.")
    : "Nothing here. Try another shelf, status or rating."}</div>`; }
}
// The LoRAs a searched image's own metadata names (ComfyUI workflow, A1111 / Civitai parameters): yours open a search
// for that LoRA, the others link to Civitai. 2026-10-13.
function madeWithLine() {
  const list = FOUND && FOUND.made_with;
  if (!IMGQ || !list) return "";
  if (!list.length) return `<div class="found madewith" title="The file names no LoRAs: a pasted screenshot has no metadata; a downloaded or saved file usually does">made with: nothing named in the image's metadata</div>`;
  const w = m => m.weight != null ? ` @${(+m.weight).toFixed(2).replace(/\.?0+$/, "")}` : "";
  return `<div class="found madewith">made with (from the image's metadata): ${list.map(m => m.owned
    ? `<a class="mw" data-name="${esc(m.name)}" title="yours (${esc(m.arch || "?")}), matched by ${esc(m.how)} - click to open it">${esc(m.name)}${w(m)}</a>`
    : `<a class="notyours" ${m.url ? `href="${esc(m.url)}" target="_blank" rel="noopener"` : ""} title="not in your library${m.url ? " - opens its Civitai page" : ""}">${esc(m.name)}${w(m)} (not yours)</a>`).join("")}</div>`;
}
function foundLine() {
  if (LOOKS) {
    const pairs = new Set(QUEUE.map(q => q.group)).size;
    return `<div class="found">${pairs ? `<b>${pairs}</b> pair${pairs === 1 ? "" : "s"} of style LoRAs whose previews look alike (CSD &ge; 0.85), side by side` :
      "No look-alike style LoRAs on this shelf."} &middot; <a id="looksoff">done</a></div>`;
  }
  if (DUPES) {
    const groups = new Set(QUEUE.map(q => q.group)).size;
    if (!groups) return `<div class="found">No duplicates: every LoRA exists once. · <a id="dupoff">done</a></div>`;
    return `<div class="found"><b>${groups}</b> LoRA${groups === 1 ? "" : "s"} exist${groups === 1 ? "s" : ""} more than once (${QUEUE.length} copies) · tick the copy to remove, then <b>Delete…</b> · <a id="dupoff">done</a></div>`;
  }
  const inFolder = FOLDER ? `<div class="found">folder <b>${esc(FOLDER.rel || "(library root)")}</b> · ${QUEUE.length} shown · <a id="leavefolder">all shelves</a>${
    $("body").classList.contains("folders-on") ? ` · <a id="selall">select all</a>` : ""}</div>` : "";
  if (!FOUND) return inFolder;
  const any = FOUND.mode === "any" ? " (no LoRA has every word: showing any word)" : "";
  const hid = FOUND.hidden > 0 ? ` · ${FOUND.hidden} hidden by the pickers · <a id="showall">show all</a>` : "";
  if (FOUND.mode === "style-off") return inFolder + `<div class="found">style search: ${esc(FOUND.reason || "off")} &middot; <a id="clearq">clear</a></div>` + madeWithLine();
  if (FOUND.mode === "image" || FOUND.mode === "like") {
    const what = FOUND.mode === "image" ? `<span class="imgchip"><img src="${IMGQ ? IMGQ.url : ""}" alt="">${esc(IMGQ ? IMGQ.name : "image")}</span>`
                                        : `<b>${esc(FOUND.anchor || "(no LoRA by that name has a style vector)")}</b>`;
    return inFolder + `<div class="found">closest look to ${what} &middot; ${FOUND.matched - (FOUND.hidden || 0)} of the ${FOUND.matched} closest${hid} &middot; <a id="clearq">clear</a></div>`
      + (FOUND.mode === "image" ? madeWithLine() : "");
  }
  const ext = FOUND.extra ? ` · +${FOUND.extra} similar look` : "";
  return inFolder + `<div class="found">${FOUND.matched} match${FOUND.matched === 1 ? "" : "es"}${any}${ext}${hid} · <a id="clearq">clear</a>${
    !FOLDER && $("body").classList.contains("folders-on") ? ` · <a id="selall">select all</a>` : ""}</div>`;
}
function drawQueue() {
  const searching = !!FOUND || DUPES || LOOKS;
  $("#queue").innerHTML = foundLine() + (QUEUE.map((q, i) => (q.extra && !(QUEUE[i - 1] || {}).extra ?
      `<div class="found" title="Their preview images are close in style to the top matches (style search), but their cards do not mention what you typed">Similar look, not in the card text</div>` : "") + `<div class="item${i === POS ? " on" : ""}${SEL.has(q.path) ? " sel" : ""}${
      (DUPES || LOOKS) && i && QUEUE[i - 1].group !== q.group ? " grp" : ""}" data-i="${i}">
      <input type="checkbox" class="ck" data-i="${i}" ${SEL.has(q.path) ? "checked" : ""} title="Select for moving (Shift-click: a range)">
      <span class="dot ${q.status}"></span><span class="n" title="${esc(q.folder)}">${esc(q.name)}</span>
      ${q.rating ? `<span class="st">${"★".repeat(q.rating)}</span>` : ""}
      ${searching ? `<small class="f" title="${esc(q.folder)}">${esc(DUPES ? q.folder.split(/[\\/]/).filter(s => !/^\d{3,}-/.test(s)).join("/") : q.folder.split(/[\\/]/).slice(0, 2).join("/"))}</small>`
                  : `<small>${q.confidence != null ? q.confidence.toFixed(2) : ""}</small>`}</div>`).join("") ||
    `<div class="empty">empty</div>`);
  $("#queue").querySelectorAll(".item").forEach(el => el.onclick = ev => {
    if (ev.target.classList.contains("ck")) return;
    guarded(() => open(+el.dataset.i)); });
  $("#queue").querySelectorAll(".ck").forEach(el => el.onclick = ev => { ev.stopPropagation(); pick(+el.dataset.i, el.checked, ev.shiftKey); });
  const dupoff = $("#dupoff"); if (dupoff) dupoff.onclick = () => toggleDupes(false);
  const leave = $("#leavefolder"); if (leave) leave.onclick = () => { FOLDER = null; $("#shelf").value = ""; syncShelfSelect(); drawFolders(); loadQueue(); };
  const selall = $("#selall"); if (selall) selall.onclick = () => { QUEUE.forEach(q => SEL.add(q.path)); selChanged(); };
  const showall = $("#showall"); if (showall) showall.onclick = () => {
    $("#shelf").value = ""; $("#status").value = "all"; $("#rating").value = "any"; loadQueue(); };
  const clearq = $("#clearq"); if (clearq) clearq.onclick = () => { $("#q").value = ""; dropImage(); loadQueue(); };
  const looksoff = $("#looksoff"); if (looksoff) looksoff.onclick = () => toggleLooks(false);
  $("#queue").querySelectorAll("a.mw").forEach(a => a.onclick = () => guarded(async () => {
    dropImage(); $("#q").value = `"${a.dataset.name}"`; LAST_Q = $("#q").value; $("#status").value = "all"; await loadQueue(); }));
  const on = $("#queue .item.on"); if (on) on.scrollIntoView({block:"nearest"});
}

// ---------- one card ---------------------------------------------------------------------------------------
async function open(i) {
  if (i < 0 || i >= QUEUE.length) return;
  POS = i; drawQueue(); msg("");
  try { CARD = await api("/api/card?path=" + encodeURIComponent(QUEUE[i].path)); }
  catch (e) { msg(e.message, true); return; }
  WORDS = null; loadWords(CARD.path);           // prompt words panel fills in when this arrives
  RECORD = null; loadRecord(CARD.path);         // sweep record panel too (2026-10-16)
  const e = CARD.edit, k = CARD.card;
  STATE = {
    facets: JSON.parse(JSON.stringify(e ? Object.assign(Object.fromEntries(NEWER_FACETS.filter(n => !(n in (e.facets || {})))
              .map(n => [n, CARD.prefill[n] || []])), e.facets) : CARD.prefill)),
    artists: [...(e ? e.artists : k.artists)],
    triggers: [...(e ? e.triggers : k.triggers)],
    trigger_states: {...((e && e.trigger_states) || {})},
    weight: e && e.weight != null ? e.weight : k.weight,
    weight_low: e && e.weight_low != null ? e.weight_low : k.weight_low,
    weight_high: e && e.weight_high != null ? e.weight_high : k.weight_high,
    rating: e && e.rating ? e.rating : null,
    notes: e ? (e.notes || "") : "",
    creator: e && e.creator != null && e.creator !== "" ? e.creator : (CARD.creator || ""),
    expanded: {},
  };
  IMGPAGE = 0; WARNED = null;
  START = snapshot();
  draw();
  if (FOLDERS_OPEN) drawFolderTools();
}
const snapshot = () => JSON.stringify({f:STATE.facets, a:STATE.artists, t:STATE.triggers, ts:STATE.trigger_states,
  w:STATE.weight, wl:STATE.weight_low, wh:STATE.weight_high, r:STATE.rating, n:STATE.notes, c:STATE.creator});
const num0 = v => Number(v ?? 0);
function otherChanged() {        // anything besides the pick lists that differs from the card (a rating alone does not count)
  const c = CARD.card, same = (a, b) => JSON.stringify([...a].sort()) === JSON.stringify([...b].sort());
  return !same(STATE.artists, c.artists) || !same(STATE.triggers, c.triggers) ||
         Object.keys(STATE.trigger_states).length > 0 ||
         num0(STATE.weight) !== num0(c.weight) || num0(STATE.weight_low) !== num0(c.weight_low) ||
         num0(STATE.weight_high) !== num0(c.weight_high) || !!STATE.notes.trim() ||
         (STATE.creator || "") !== (CARD.creator || "");
}
function dirty() { return snapshot() !== START; }
function updateSaveButton() {
  const prefillSame = Object.keys({...CARD.prefill, ...STATE.facets}).every(k =>
    JSON.stringify([...(CARD.prefill[k] || [])].sort()) === JSON.stringify([...(STATE.facets[k] || [])].sort()));
  const ratingSame = (STATE.rating || null) === ((CARD.edit && CARD.edit.rating) || null);
  $("#save").textContent = (prefillSame && !otherChanged() && ratingSame) ? "Looks right ↵" : "Save ↵";
}

function draw() {
  const c = CARD, k = c.card;
  const conf = k.confidence != null ? k.confidence.toFixed(2) : "?";
  $("#main").innerHTML = `<div class="card">
   <div class="left">
    <div class="head">
     <div class="title"><h2>${esc(c.name)}</h2><span class="ver">${esc(c.version)}</span>
       <span class="stars" id="stars" title="Your rating: click, or Shift+1-5 (Shift+0 clears). Saved with the card."></span></div>
     <div class="badges">
      <span class="badge">${esc(k.kind)} / ${esc(k.scope)}</span>
      <span class="badge${k.confidence < 0.6 ? " warn" : ""}">conf ${conf}</span>
      ${c.base_model ? `<span class="badge">${esc(c.base_model)}</span>` : ""}
      ${c.source ? `<span class="badge">${esc(c.source)}</span>` : ""}
      ${(k.nsfw || 0) >= 2 ? `<span class="badge warn">nsfw ${k.nsfw}</span>` : ""}
      ${c.lm_favorite ? `<span class="badge good">favourite</span>` : ""}
      ${c.lm_exclude ? `<span class="badge warn">excluded in LoRA Manager</span>` : ""}
      ${c.edit ? `<span class="badge good">you: ${esc(c.edit.status)} ${esc((c.edit.edited_at || "").slice(0, 10))}</span>` : ""}
      ${c.civitai_url ? `<span class="badge"><a href="${esc(c.civitai_url)}" target="_blank" rel="noopener">Civitai ↗</a></span>` : ""}
      ${c.community && c.community.score != null ? `<span class="badge${c.community.score >= 75 ? " score" : ""}" title="Community score: percentile among ${esc(c.community.score_group)} (approval, likes per download, downloads per day, people posting with it, reactions). A popularity prior - your stars win.">Civitai ${topText(c.community.score)}</span>` : ""}
      ${c.community && c.community.newer_version ? `<span class="badge warn" title="A newer version of this model, same base model, is on Civitai">newer: ${esc(c.community.newer_version)}</span>` : ""}
      ${c.community && c.community.other_bases ? `<span class="badge" title="The same Civitai model also has versions for these base models, and you have none of them:&#10;${esc(c.community.other_bases.split("; ").join("\n"))}">also for: ${esc(c.community.other_bases.split("; ").map(s => s.split(": ")[0]).join(", "))}</span>` : ""}
     </div>
     <div class="file" title="click to copy the path" id="file">${esc(c.folder)}\\${esc(c.file)}</div>
     <div><button id="copyname" class="badge" style="cursor:copy;background:none" title="copy the file name without its extension - paste it into the LoRA Stack's slot search, the stack's paste button, or a sweep's lora_files">copy name</button>
          <button id="copytag" class="badge" style="cursor:copy;background:none" title="copy &lt;lora:name:weight&gt; and the trigger words, for Forge / AUTOMATIC1111 prompts (uses the weight and triggers as they are on this card now)">copy as prompt tag</button></div>
    </div>
    <div id="images"></div>
    <div id="similar"></div>
    <div id="audience">${audienceHtml()}</div>
    ${evidenceHtml()}
   </div>
   <div class="cols" id="inputs"><div class="col" id="colA"></div><div class="col" id="colB"></div></div>
  </div>`;
  $("#file").onclick = () => navigator.clipboard?.writeText(c.path).then(() => msg("path copied"));
  $("#copytag").onclick = () => navigator.clipboard?.writeText(promptTag(c)).then(() => msg("prompt tag copied"));
  $("#copyname").onclick = () => navigator.clipboard?.writeText(String(c.file || "").replace(/\.[^.]+$/, ""))
    .then(() => msg("name copied"));
  drawImages();
  drawSimilar();
  drawStars();
  drawFacets();
  wireAudience();
}

// ---------- images -----------------------------------------------------------------------------------------
const imgUrl = i => `/img?path=${encodeURIComponent(CARD.path)}&i=${i}`;
function drawImages() {
  const n = CARD.image_count, box = $("#images");
  const getBtn = CARD.has_civitai && n < PER_PAGE ? `<button class="getciv" id="getciv">Get ${n ? "more " : ""}images from Civitai</button>` : "";
  const wireGet = () => { const b = $("#getciv"); if (!b) return; b.onclick = async () => {
    b.disabled = true; b.textContent = "downloading from Civitai...";
    try { const r = await api("/api/fetch_images", {path: CARD.path}); CARD.image_count = r.image_count;
          msg(r.saved ? `saved ${r.saved} image(s) next to the LoRA` : (r.available ? "nothing new to save" : "Civitai has no images for this version"));
          drawImages(); }
    catch (e) { msg(e.message, true); b.disabled = false; b.textContent = "Get images from Civitai"; } }; };
  if (!n) { box.innerHTML = `<div class="none">no example images</div>` + getBtn; wireGet(); return; }
  const pages = Math.ceil(n / PER_PAGE);
  IMGPAGE = Math.max(0, Math.min(IMGPAGE, pages - 1));

  box.querySelectorAll("[data-pg]").forEach(b => b.onclick = () => { IMGPAGE = (IMGPAGE + +b.dataset.pg + pages) % pages; drawImages(); });
}

const PEER_LABELS = [["downloads", "downloads"], ["engagement", "likes / download"], ["images_per_day", "images / day"],

const ALWAYS_OPEN = new Set(["role", "use", "medium", "period", "genre", "mood", "rendering", "nsfw", "side_effects"]);
// Facets added after some cards were already reviewed: an edit saved before they existed takes the model's picks
// for them (an edit saved since keeps yours, even when empty). Same rule in facets.py.
const NEWER_FACETS = ["genre", "mood"];
const CHARACTER_FACETS = new Set(["depicts", "figure", "appearance", "costume"]);
function isOpen(name) {
  if (STATE.open && name in STATE.open) return STATE.open[name];
  if (ALWAYS_OPEN.has(name)) return true;
  if (CHARACTER_FACETS.has(name) && (STATE.facets.role || []).includes("subject")) return true;
  if ((STATE.facets[name] || []).length || (CARD.prefill[name] || []).length) return true;
  return recall("open_" + name) === "1";
}
function facetSection(name) {
  const f = VOCAB.facets[name], chosen = new Set(STATE.facets[name] || []), model = new Set(CARD.prefill[name] || []);
  const label = esc(facetLabel(name));
  if (!isOpen(name)) {
    return `<section class="facet closed"><h3 class="toggle" data-open="${name}"><span class="tw">▸</span>${label}
      <span class="help">${esc(f.help)}</span><span class="pick">${chosen.size ? chosen.size + " chosen" : "open"}</span></h3></section>`;
  }
  const chip = (id, cls) => {
    const t = f.terms[id], kids = t.children.length;
    const open = STATE.expanded[name + ":" + id] || t.children.some(ch => chosen.has(ch) || model.has(ch) ||
                  f.terms[ch].children.some(g => chosen.has(g) || model.has(g)));
    const more = kids ? `<span class="more" data-toggle="${esc(id)}">${open ? "▾" : "▸"}${kids}</span>` : "";
    let out = `<span class="chip ${cls}${kids ? " group" : ""}${chosen.has(id) ? " sel" : ""}${model.has(id) ? " model" : ""}"
                 data-facet="${name}" data-term="${esc(id)}" title="${esc(t.aliases.join(", "))}">${esc(t.label)}${more}</span>`;
    if (kids && open) out += t.children.map(ch => chip(ch, "child")).join("");
    return out;
  };
  const free = [...chosen].filter(id => !f.terms[id]).map(id =>
    `<span class="chip free sel" data-facet="${name}" data-free="${esc(id)}" title="your own word: + makes it a button for every card, × removes it">${esc(id)}<span class="mk" data-make="1">＋</span><span class="x">×</span></span>`).join("");
  const groups = f.top.filter(id => f.terms[id].children.length);
  const promote = STATE.promote && STATE.promote.facet === name ? `<div class="promote">Make "${esc(STATE.promote.word)}" a button in ${esc(facetLabel(name))}
      <select id="promote_parent"><option value="">at the top level</option>${groups.map(g => `<option value="${esc(g)}">under ${esc(f.terms[g].label)}</option>`).join("")}</select>
      <button class="go" id="promote_go">Add button</button><button id="promote_cancel">cancel</button></div>` : "";

  return `<section class="facet" data-name="${name}"><h3 class="${ALWAYS_OPEN.has(name) ? "" : "toggle"}" data-close="${name}">${ALWAYS_OPEN.has(name) ? "" : '<span class="tw">▾</span>'}${label} <span class="help">${esc(f.help)}</span>
      <span class="pick">${f.pick === "one" ? "pick one" : "pick any"}</span></h3>
    <div class="chips">${f.top.map(id => chip(id, "")).join("")}${free}</div>${promote}
    <div class="addbox"><div class="suggest"><input data-add="${name}" placeholder="find or add a word..." autocomplete="off"><ul hidden></ul></div></div>
  </section>`;
}

function creatorSection() {

// trigger words: click cycles normal -> priority -> off; double-click edits; x removes
const TRIGGER_CYCLE = {normal:"priority", priority:"off", off:"normal"};
function triggerSection() {
  const chips = STATE.triggers.map((v, i) => {
    const s = STATE.trigger_states[v] || "normal";
    return `<span class="chip trig ${s}" data-trig="${i}" title="${s}: click to change (normal → ★ priority → off) · double-click to edit">${
      s === "priority" ? "★ " : ""}${esc(v)}<span class="x" data-trig-x="${i}">×</span></span>`;
  }).join("") || `<small class="muted">none</small>`;
  return `<section class="facet"><h3>Trigger words <span class="help">Click: normal → ★ priority (goes first) → off (never added to prompts). Double-click to edit.</span></h3>
    <div class="chips" id="trigchips">${chips}</div>
    <div class="addbox"><div class="suggest"><input data-text="triggers" placeholder="add a trigger..." autocomplete="off"><ul hidden></ul></div></div>
  </section>`;
}
function cycleTrigger(i) {
  const v = STATE.triggers[i]; if (v == null) return;
  const next = TRIGGER_CYCLE[STATE.trigger_states[v] || "normal"];
  if (next === "normal") delete STATE.trigger_states[v]; else STATE.trigger_states[v] = next;
  drawFacets();
}
function editTrigger(el, i) {
  const old = STATE.triggers[i]; if (old == null) return;
  const input = document.createElement("input");
  input.className = "trigedit"; input.value = old;
  el.replaceWith(input); input.focus(); input.select();
  let finished = false;
  const done = keep => {
    if (finished) return; finished = true;
    const v = input.value.trim();
    if (keep && v !== old) {
      const state = STATE.trigger_states[old]; delete STATE.trigger_states[old];
      if (!v || STATE.triggers.includes(v)) STATE.triggers.splice(i, 1);
      else { STATE.triggers[i] = v; if (state) STATE.trigger_states[v] = state; }
    }
    drawFacets();
  };
  input.onkeydown = ev => {
    if (ev.key === "Enter") { ev.preventDefault(); ev.stopPropagation(); done(true); }
    else if (ev.key === "Escape") { ev.preventDefault(); ev.stopPropagation(); done(false); }
  };
  input.onblur = () => done(true);
}

// prompt words (2026-10-15, trigger_picks.py): which recipe variant a prompt gets, per card and per checkpoint.

function weightBar() {
  const k = CARD.card;
  const comm = CARD.community && CARD.community.weight_n >= 10 ? CARD.community : null;
  const values = [k.weight_low, k.weight_high, k.weight, STATE.weight_low, STATE.weight_high, STATE.weight,
                  ...(comm ? [comm.weight_p25, comm.weight_p75] : [])]
    .filter(x => x != null && x !== "" && !isNaN(x)).map(Number);
  let lo = Math.min(0, ...values), hi = Math.max(1, ...values);
  const pad = (hi - lo) * 0.06; lo -= pad; hi += pad;
  const at = x => ((Number(x) - lo) / (hi - lo) * 100).toFixed(2) + "%";
  const band = (a, b, cls) => (a == null || b == null) ? "" :
    `<div class="band ${cls}" style="left:${at(Math.min(a, b))};width:calc(${at(Math.max(a, b))} - ${at(Math.min(a, b))})"></div>`;
  const fmt = x => Math.round(x * 100) / 100;
  return `<div class="track">${lo < 0 ? `<div class="zero" style="left:${at(0)}" title="0"></div>` : ""}
      ${band(k.weight_low, k.weight_high, "model")}${band(STATE.weight_low, STATE.weight_high, "mine")}
      ${comm ? band(comm.weight_p25, comm.weight_p75, "comm") + `<div class="ctick" style="left:${at(comm.weight_median)}" title="community median ${comm.weight_median}"></div>` : ""}
      ${STATE.weight != null ? `<div class="tick" style="left:${at(STATE.weight)}" title="typical ${STATE.weight}"></div>` : ""}</div>
    <div class="scale"><span>${fmt(lo)}</span><span>${fmt(hi)}</span></div>`;
}

function focusAdd(attr, name) { const el = document.querySelector(`input[${attr}="${name}"]`); if (el) el.focus(); }

function termMatches(name, q) {
  const f = VOCAB.facets[name], w = q.trim().toLowerCase();
  if (!w) return [];
  const hits = [];
  for (const [id, t] of Object.entries(f.terms)) {
    const words = [t.label, ...t.aliases].map(x => x.toLowerCase());
    const best = words.find(x => x.startsWith(w)) || words.find(x => x.includes(w));
    if (best) hits.push({id, label: t.label + (best !== t.label.toLowerCase() ? `  (${best})` : ""), rank: best.startsWith(w) ? 0 : 1});
  }
  hits.sort((a, b) => a.rank - b.rank || a.label.localeCompare(b.label));
  const exact = hits.filter(h => [f.terms[h.id].label, ...f.terms[h.id].aliases].some(x => x.toLowerCase() === w));
  const rest = hits.filter(h => !exact.includes(h)).slice(0, 10);
  if (exact.length) return [...exact.map(h => ({...h, exact:true})), ...rest];   // typed a known word: Enter picks it
  return [{text: w, label: `add "${w}" as your own word`}, ...rest];              // otherwise Enter adds what you typed
}

function suggestBox(input, source, choose) {
  const ul = input.nextElementSibling; let items = [], on = 0, timer = null;
  const render = () => { ul.hidden = !items.length;
    ul.innerHTML = items.map((it, i) => `<li class="${i === on ? "on" : ""}" data-i="${i}">${esc(it.label)}</li>`).join("");
    ul.querySelectorAll("li").forEach(li => li.onmousedown = ev => { ev.preventDefault(); choose(items[+li.dataset.i]); }); };
  input.oninput = () => { clearTimeout(timer); timer = setTimeout(async () => {
    try { items = await source(input.value); } catch (e) { items = []; }
    if (!items.length && input.value.trim() && input.dataset.text) items = [{text: input.value.trim(), label: `add "${input.value.trim()}"`}];
    on = 0; render(); }, 120); };
  input.onkeydown = ev => {
    if (ev.key === "ArrowDown") { on = Math.min(on + 1, items.length - 1); render(); ev.preventDefault(); }
    else if (ev.key === "ArrowUp") { on = Math.max(on - 1, 0); render(); ev.preventDefault(); }
    else if (ev.key === "Enter") { ev.preventDefault(); ev.stopPropagation();
      if (items[on]) choose(items[on]); else if (input.value.trim()) choose({text: input.value.trim()}); }
    else if (ev.key === "Escape") { items = []; render(); input.blur(); }
  };
  input.onblur = () => setTimeout(() => { items = []; render(); }, 150);
}

    if (ev.key === "Escape") closeModal();
    return;
  }
  const typing = /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || "");
  const zoomed = $("#overlay").classList.contains("on");
  if (DISC_ON) {                                     // Discover (2026-10-29): its own keys

  const paths = selected();
  if (!paths.length) { msg("tick some LoRAs first", true); return; }
  if (CARD && dirty()) { msg("save or undo this card's changes first", true); return; }
  let warn = "";
  if (DUPES) {                                                 // every copy of something ticked = it would be gone
    const all = QUEUE.filter(q => paths.includes(q.path)).map(q => q.group);
    const whole = [...new Set(all)].filter(g => QUEUE.filter(q => q.group === g).every(q => paths.includes(q.path)));
    if (whole.length) warn = `<p class="warn">Every copy of ${whole.map(g => esc(QUEUE.find(q => q.group === g).name)).join(", ")} is ticked - none would be left in the library.</p>`;
  }
  modal(`<h3>Planning…</h3>`);
  try {
    const plan = await postPlan({action:"delete", paths});
    showPlan(plan, `Move ${paths.length} LoRA${paths.length === 1 ? "" : "s"} to the trash`);
    if (warn) $("#modal h3").insertAdjacentHTML("afterend", warn);
  } catch (e) { modal(`<p class="warn">${esc(e.message)}</p>`); }
}
function newFolderDialog() {
  const parent = FOLDER ? FOLDER : FOLDERS.find(f => f.depth === 0);
  modal(`<h3>New folder inside ${esc(parent.rel || "the library root")}</h3>
    <div class="row"><input type="text" id="m_name" placeholder="e.g. comic" spellcheck="false"><button class="go" id="m_plan">Next</button><button id="m_cancel">Cancel</button></div>`);
  $("#m_cancel").onclick = closeModal;
  const go = async () => showPlan(await postPlan({action:"new", parent: parent.path, name: $("#m_name").value}), `New folder ${esc(parent.rel ? parent.rel + "/" : "")}${esc($("#m_name").value)}`);
  $("#m_plan").onclick = go; $("#m_name").onkeydown = ev => { if (ev.key === "Enter") go(); }; $("#m_name").focus();
}
function renameDialog() {
  if (!FOLDER) return;
  modal(`<h3>Rename or move ${esc(FOLDER.rel)}</h3>
    <p class="muted" style="font-size:12px">Change the last part to rename it; change the path to move it (with everything in it). Path from the library root.</p>
    <div class="row"><input type="text" id="m_path" value="${esc(FOLDER.rel)}" spellcheck="false"><button class="go" id="m_plan">Next</button><button id="m_cancel">Cancel</button></div>`);
  $("#m_cancel").onclick = closeModal;
  const root = FOLDER.root;
  const go = async () => {
    const rel = $("#m_path").value.trim().replace(/^[\\/]+|[\\/]+$/g, "");
    showPlan(await postPlan({action:"rename", folder: FOLDER.path, new_path: root + "\\" + rel.replace(/\//g, "\\")}), `${esc(FOLDER.rel)} → ${esc(rel)}`);
  };
  $("#m_plan").onclick = go; $("#m_path").onkeydown = ev => { if (ev.key === "Enter") go(); };
  const input = $("#m_path"); input.focus(); input.setSelectionRange(FOLDER.rel.lastIndexOf("/") + 1, FOLDER.rel.length);
}
async function applyPlan(id) {
  modal(`<h3>Working…</h3>`);
  let r;
  try { r = await api("/api/organise/apply", {id}); }
  catch (e) { modal(`<h3>Problem</h3><p class="warn">${esc(e.message)}</p><div class="row"><button id="m_cancel">Close</button></div>`); $("#m_cancel").onclick = closeModal; await afterChange(); return; }
  if (!r.moved && !r.failed.length) {                          // a new folder: nothing moved
    modal(`<h3 class="good">Done</h3><p>Folder made: ${esc(r.created_dirs.map(short).join(", "))}</p><div class="row"><button class="go" id="m_cancel">Close</button></div>`);
    $("#m_cancel").onclick = closeModal; await afterChange(null, r.created_dirs[0]); return;
  }
  const failed = r.failed.length ? `<p class="warn">Not moved (${r.failed.length}):</p><ul>${r.failed.map(f => `<li>${esc(f.label)} — ${esc(f.reason)}</li>`).join("")}</ul>` : "";
  modal(`<h3 class="good">Done</h3><ul><li>${r.moved} LoRA${r.moved === 1 ? "" : "s"} ${r.kind === "delete" ? "moved to the trash" : "moved"}${r.created_dirs.length && r.kind !== "delete" ? `, ${r.created_dirs.length} folder(s) made` : ""}${
      r.removed_dirs.length ? `, ${r.removed_dirs.length} empty downloader folder(s) removed` : ""}</li>
      ${r.lm_metadata ? `<li>LoRA Manager metadata updated for ${r.lm_metadata}; it is asked to rescan if ComfyUI is running</li>` : ""}</ul>${failed}
    <div id="m_refs">${r.moved ? `<button id="m_findrefs">Find saved workflows / notes that still name them</button>` : ""}</div>
    <div class="row"><button class="go" id="m_cancel">Close</button></div>`);
  $("#m_cancel").onclick = closeModal;
  const fr = $("#m_findrefs"); if (fr) fr.onclick = () => showRefs(r.id);
  const moved = r.mapping || {}, open_ = CARD && moved[CARD.path];
  SEL = new Set([...SEL].filter(p => !(p in moved)));
  await afterChange(open_, r.target);
}
async function showRefs(id) {
  $("#m_refs").innerHTML = `<p class="muted">searching…</p>`;
  try {
    const r = await api("/api/organise/references?id=" + encodeURIComponent(id));
    $("#m_refs").innerHTML = r.files.length ? `<p>${r.files.length} saved file(s) of ${r.searched} still name a moved LoRA (they were not changed):</p>
      <ul>${r.files.map(f => `<li>${esc(f.file)}<br><span class="muted">${esc(f.loras.join(", "))}</span></li>`).join("")}</ul>`
      : `<p class="good">None of ${r.searched} saved files name the moved LoRAs.</p>`;
  } catch (e) { $("#m_refs").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
}
async function historyDialog() {
  const list = await api("/api/organise/batches");
  const newest = list.find(b => !b.undone_at && (b.moved || b.created_dirs));
  modal(`<h3>Past changes</h3><p class="muted" style="font-size:12px">Undo works newest first.</p>
    <table>${list.map(b => `<tr><td>${esc(b.applied_at || "").replace("T", " ")}</td>
      <td>${b.kind === "delete" ? `deleted ${b.moved} (to the trash)` : b.kind === "move" ? `moved ${b.moved} to ${esc(short(b.target || ""))}` : b.kind === "rename_folder" ? `${esc(short(b.source || ""))} → ${esc(short(b.target || ""))} (${b.moved} LoRAs)` : `new folder ${esc(short(b.target || ""))}`}</td>
      <td>${b.undone_at ? `<span class="muted">undone</span>` : (newest && b.id === newest.id ? `<button data-id="${esc(b.id)}" class="m_undo">Undo</button>` : "")}</td></tr>`).join("") || "<tr><td>nothing yet</td></tr>"}</table>
    <div id="m_undo_msg"></div><div class="row"><button id="m_cancel">Close</button></div>`);
  $("#m_cancel").onclick = closeModal;
  document.querySelectorAll(".m_undo").forEach(el => el.onclick = async () => {
    el.disabled = true; $("#m_undo_msg").innerHTML = `<p class="muted">undoing…</p>`;
    try { const r = await api("/api/organise/undo", {id: el.dataset.id}); $("#m_undo_msg").innerHTML = `<p class="good">Put back ${r.restored} LoRA(s).</p>`; }
    catch (e) { $("#m_undo_msg").innerHTML = `<p class="warn">${esc(e.message)}</p>`; }
    SEL.clear(); await afterChange(); setTimeout(historyDialog, 900);
  });
}
async function afterChange(newPath, followFolder) {
  try {
    await loadFolders();
    if (FOLDER) FOLDER = FOLDERS.find(f => f.path === FOLDER.path)            // still there
      || (followFolder && FOLDERS.find(f => f.path.toLowerCase() === followFolder.toLowerCase())) || null;   // renamed / moved
    drawFolders();
    await loadShelves();
    await loadQueue(newPath || (CARD && CARD.path));
  } catch (e) { msg(e.message, true); }
}

// ---------- style search (style.py: CSD style vectors from preview images; optional) ----------------------------
let STYLE = {enabled:false, image_search:false};
let IMGQ = null;                 // {file, url, name} while the list is an image search
let LOOKS = false;               // the Look-alikes list
const SIM = {all: recall("sim_all") === "1", kinds: recall("sim_kinds") === "1", nsfw: recall("sim_nsfw") === "1"};
async function loadStyleStatus() {
  try { STYLE = await api("/api/style_status"); } catch (e) { STYLE = {enabled:false, image_search:false}; }
  $("#looksbtn").style.display = STYLE.enabled ? "" : "none";
  $("#imgbtn").style.display = STYLE.image_search ? "" : "none";
}
async function apiImage(url, file) {
  const r = await fetch(url, {method:"POST", headers:{"Content-Type": file.type || "application/octet-stream"}, body:file});
  const data = await r.json().catch(() => ({error:"bad response"}));
  if (!r.ok || data.error) throw new Error(data.error || r.statusText);
  return data;
}
function dropImage() { if (IMGQ) { URL.revokeObjectURL(IMGQ.url); IMGQ = null; } }
async function searchImage(file) {
  if (!file || !/^image\//.test(file.type || "")) { msg("that is not an image file", true); return; }
  if (!STYLE.image_search) { msg("style search: " + (STYLE.reason || "off"), true); return; }
  dropImage();
  IMGQ = {file, url: URL.createObjectURL(file), name: file.name || "pasted image"};
  $("#q").value = ""; LAST_Q = "";
  if (DUPES) { DUPES = false; $("#dupbtn").classList.remove("on"); }
  if (LOOKS) { LOOKS = false; $("#looksbtn").classList.remove("on"); }
  $("body").classList.remove("dupes");
  msg("finding LoRAs with that look... (the first image search loads the style model, about 15 s)");
  try { await guarded(() => loadQueue()); msg(""); }
  catch (e) { dropImage(); msg(e.message, true); }
}
function toggleLooks(on) {
  if (on && DISC_ON) discoverOff(true);
  if (on && DUPES) { DUPES = false; $("#dupbtn").classList.remove("on"); }
  LOOKS = on; $("#looksbtn").classList.toggle("on", on); $("body").classList.toggle("dupes", on);
  if (on) dropImage();
  SEL.clear(); loadQueue().catch(e => msg(e.message, true));
}
$("#looksbtn").onclick = () => guarded(() => toggleLooks(!LOOKS));

// ---------- Discover (2026-10-29, docs/design/DISCOVER_STAGE1.md): LoRAs you don't own ------------------------------
// Ranked by how often Civitai users put them in the same image as YOUR LoRAs, weighted by how you rate yours, times
// Civitai's community score; for the base model of the selected shelf. var, not let: loadQueue may run first.
var DISC_ON = false, DISC = null, DISC_POS = 0;
function discShelf() {
  const v = $("#shelf").value;
  if (v === "__folder__") return FOLDER && FOLDER.rel ? FOLDER.rel.split(/[\\/]/)[0] : "";
  return v;
}
function discoverOff(silent) {
  DISC_ON = false; DISC = null; $("#discbtn").classList.remove("on"); $("body").classList.remove("discover");
  if (!silent) guarded(() => loadQueue(CARD ? CARD.path : undefined));
}
async function toggleDiscover(on) {
  if (!on) { discoverOff(false); return; }
  if (DUPES) { DUPES = false; $("#dupbtn").classList.remove("on"); }
  if (LOOKS) { LOOKS = false; $("#looksbtn").classList.remove("on"); }
  $("body").classList.remove("dupes");
  DISC_ON = true; $("#discbtn").classList.add("on"); $("body").classList.add("discover");
  await loadDiscover();
}
async function loadDiscover() {
  const shelf = discShelf();
  $("#queue").innerHTML = `<div class="found">Discover: finding LoRAs you don't own${shelf ? " for " + esc(shelf) : ""}... (the first time can take a few seconds - Civitai numbers)</div>`;
  $("#main").innerHTML = "";
  DISC = await api("/api/discover?" + new URLSearchParams({shelf, top: "100"}));
  DISC_POS = 0; drawDiscover(); discOpen(0);
}
function drawDiscover() {
  const d = DISC || {items: []};
  const h = d.harvested || {};
  const head = d.note ? `<div class="found">${esc(d.note)} &middot; <a id="discoff">done</a></div>`
    : `<div class="found" title="Ranked by how often Civitai users put each LoRA in the same image as yours (distinct people), weighted by your ratings of yours, times Civitai's community score. Harvest: ${h.loras || 0} of your LoRAs, last ${esc(h.last || "?")} - refresh with python run.py harvest --only <folder>, then python run.py pairs.">Discover: <b>${d.items.length}</b> LoRAs you don't own${d.bases && d.bases.length ? " (" + esc(d.bases.join(", ")) + ")" : ""}${d.dismissed ? ` &middot; ${d.dismissed} hidden` : ""} &middot; <a id="discoff">done</a></div>`;
  $("#queue").innerHTML = head + (d.items.map((it, i) => `<div class="item${i === DISC_POS ? " on" : ""}" data-di="${i}">
      <span class="n" title="${esc(it.name)}">${esc(it.name)}</span>${it.other_version ? `<small class="ov" title="you have another version of this model">have v.</small>` : ""}
      <small title="Discover rank">${Math.round(it.rank)}</small></div>`).join("") || "");
  $("#queue").querySelectorAll(".item").forEach(el => el.onclick = () => discOpen(+el.dataset.di));
  const off = $("#discoff"); if (off) off.onclick = () => discoverOff(false);
}
function discOpen(i) {
  if (!DISC || !DISC.items.length) {
    $("#main").innerHTML = `<div class="empty">${esc((DISC && DISC.note) || "Nothing to suggest yet for this shelf.")}</div>`;
    return;
  }
  DISC_POS = Math.max(0, Math.min(DISC.items.length - 1, i));
  $("#queue").querySelectorAll(".item").forEach(el => el.classList.toggle("on", +el.dataset.di === DISC_POS));
  const sel = $("#queue").querySelector(".item.on"); if (sel) sel.scrollIntoView({block: "nearest"});
  const it = DISC.items[DISC_POS], c = it.civitai || {};
  const yours = p => p.rating ? "&#9733;".repeat(p.rating)
    : p.quality != null ? `${p.quality >= 0 ? "+" : ""}${p.quality.toFixed(1)} vs your average` : `<span class="muted">not rated</span>`;
  const rows = it.partners.map(p => `<tr><td>${esc(p.name)}</td><td>${yours(p)}</td><td class="n">${p.users} people</td>
      <td class="n muted" title="how much more often the two meet than chance">lift ${(+p.lift).toFixed(1)}</td>
      <td class="n muted" title="how much this one adds to the rank: pair score x your taste (${p.taste})">${p.contribution.toFixed(1)}</td></tr>`).join("");
  const w = it.weights ? `<b>${it.weights.median}</b> <span class="muted">(people used ${it.weights.low} to ${it.weights.high}, ${it.weights.n} times)</span>` : "unknown";
  $("#main").innerHTML = `<div class="disc">
    <h2>${esc(it.name)} <small>${esc(it.version || "")}</small></h2>
    <div class="badges"><span class="badge">${esc(it.base_model || "?")}</span>${it.nsfw ? `<span class="badge warn">NSFW</span>` : ""}
      ${c.score != null ? `<span class="badge" title="Civitai community score 0-100: approval, likes per download, downloads per day - each a percentile among your LoRAs of the same base">Civitai ${Math.round(c.score)}</span>` : ""}
      ${c.downloads != null ? `<span class="badge">${(+c.downloads).toLocaleString()} downloads</span>` : ""}
      ${c.up != null ? `<span class="badge">${c.up} up / ${c.down || 0} down</span>` : ""}
      ${it.other_version ? `<span class="badge warn" title="${esc(it.other_version)}">you have another version</span>` : ""}</div>
    <p class="why">Used together with <b>${it.n_partners}</b> of your LoRAs in Civitai images${it.n_partners > it.partners.length ? ` (the ${it.partners.length} that count most)` : ""}:</p>
    <table class="disctbl"><tr><th>your LoRA</th><th>your rating</th><th>used together by</th><th></th><th>adds</th></tr>${rows}</table>
    <p class="why">Weight people give it: ${w}</p>
    ${it.examples.length ? `<p class="why">Example images on Civitai: ${it.examples.map((u, k) => `<a href="${esc(u)}" target="_blank" rel="noopener">${k + 1}</a>`).join(" &middot; ")}</p>` : ""}
    <div class="discbtns">
      ${it.url ? `<a class="btn primary" href="${esc(it.url)}" target="_blank" rel="noopener">Open on Civitai</a>` : ""}
      ${it.version_id ? `<button id="disccopy" title="for the Civitai downloader">Copy version id ${it.version_id}</button>` : ""}
      <button id="discno" title="Hide it from Discover and from run.py pairs --wishlist (undo appears below)">Not interested</button>
    </div>
    <p class="muted small">J / K or arrows: next / previous &middot; Esc: back to your cards</p></div>`;
  const cp = $("#disccopy");
  if (cp) cp.onclick = () => { navigator.clipboard.writeText(String(it.version_id)).then(() => msg("version id copied"), () => msg("copy failed", true)); };
  $("#discno").onclick = () => discDismiss(it).catch(e => msg(e.message, true));
}
async function discDismiss(it) {
  await api("/api/discover/dismiss", {key: it.key, name: it.name});
  const i = DISC.items.indexOf(it);
  DISC.items.splice(i, 1); DISC.dismissed = (DISC.dismissed || 0) + 1;
  drawDiscover(); discOpen(i);
  $("#msg").className = "msg";
  $("#msg").innerHTML = `hid ${esc(it.name)} &middot; <a id="discundo" style="cursor:pointer;color:var(--accent)">undo</a>`;
  $("#discundo").onclick = async () => {
    await api("/api/discover/dismiss", {key: it.key, undo: true});
    DISC.items.splice(i, 0, it); DISC.dismissed = Math.max(0, DISC.dismissed - 1);
    drawDiscover(); discOpen(i); msg("restored " + it.name);
  };
}
$("#discbtn").onclick = () => guarded(() => toggleDiscover(!DISC_ON));
$("#imgbtn").onclick = () => $("#imgfile").click();
$("#imgfile").onchange = () => { const f = $("#imgfile").files[0]; $("#imgfile").value = ""; searchImage(f); };
(() => {
  const box = $("#q").parentElement;
  const hasFile = ev => [...(ev.dataTransfer?.items || [])].some(i => i.kind === "file");
  box.addEventListener("dragover", ev => { if (hasFile(ev)) { ev.preventDefault(); box.classList.add("drop"); } });
  box.addEventListener("dragleave", () => box.classList.remove("drop"));
  box.addEventListener("drop", ev => { if (!hasFile(ev)) return; ev.preventDefault(); box.classList.remove("drop"); searchImage(ev.dataTransfer.files[0]); });
  $("#q").addEventListener("paste", ev => {
    const f = [...(ev.clipboardData?.files || [])].find(x => /^image\//.test(x.type));
    if (f) { ev.preventDefault(); searchImage(f); } });
})();
// "Similar look" under the example images: the LoRAs whose previews are closest in style to this one's
async function drawSimilar() {
  const box = $("#similar"); if (!box || !CARD) return;
  if (!STYLE.enabled) { box.innerHTML = ""; return; }
  const path = CARD.path;
  const p = new URLSearchParams({path, n:"8", scope: SIM.all ? "all" : "base", kinds: SIM.kinds ? "all" : "look", nsfw: SIM.nsfw ? "1" : "0"});
  let d;
  try { d = await api("/api/similar?" + p); } catch (e) { box.innerHTML = ""; return; }
  if (!CARD || CARD.path !== path) return;
  if (d.off) { box.innerHTML = ""; return; }
  if (!d.info) { box.innerHTML = `<div class="shead"><b>Similar look</b><span>${esc(d.note || "")}</span></div>`; return; }
  const a = d.info.agreement;
  const agree = a == null ? "one preview only" : `previews agree: ${a >= 0.55 ? "high" : a >= 0.35 ? "mixed" : "low"}`;
  const tog = (key, label, title) => `<button class="tog${SIM[key] ? " on" : ""}" data-k="${key}" title="${esc(title)}">${label}</button>`;
  const notes = [];
  if (!d.info.look) notes.push(`<div class="note">This is not a style LoRA (card kind ${esc(CARD.card.kind || "?")}): its previews mostly show a plain photo look, so these neighbours share that look more than anything this LoRA adds.</div>`);
  if (d.info.same_previews && d.info.same_previews.length) notes.push(`<div class="note plain">Same preview images as: ${d.info.same_previews.map(esc).join(", ")} - previews cannot tell these apart.</div>`);
  const likeWord = SIM.all ? "likeall" : "like";
  // render check (run.py style --renders): does this LoRA show its preview look in our own sweep renders?
  const RV = {shows: ["good", "shows its look"], needs_words: ["warn", "needs its style words"],
              weak: ["warn", "look weak in renders"], unclear: ["", "render check: unclear"]};
  const rv = RV[d.info.render_verdict];
  const verdict = rv ? ` <span class="badge ${rv[0]}" title="${esc((d.info.render_label || "") + (d.info.render_note ? "\n" + d.info.render_note : ""))}">${rv[1]}</span>` : "";
  box.innerHTML = `<div class="shead"><b>Similar look</b>${verdict}
      <span title="How alike this LoRA's own preview images are in style (CSD cosine ${a == null ? "-" : a.toFixed(2)}; pilot: one LoRA ~0.50, different LoRAs ~0.12). Low: a subject or concept LoRA shown in many looks, or previews made with other LoRAs.">${agree} &middot; ${d.info.n_images} preview${d.info.n_images === 1 ? "" : "s"}</span>
      <span class="sp">${tog("all", "all bases", "Off: the same base model only (Krea2 with Krea2). On: every base model, with its base shown")}${
        tog("kinds", "all kinds", "Off: style, photo-look and lighting LoRAs only. On: every kind of LoRA")}${
        tog("nsfw", "NSFW", "Off: hide LoRAs whose card is rated nudity or explicit. On: show them")}
      <button class="tog" id="simlist" title="Put the whole list on the left, closest look first (${likeWord}:)">list all</button></span></div>
    ${notes.join("")}
    ${d.items.length ? `<div class="strip">${d.items.map(s => `<div class="tile" data-path="${esc(s.path)}" title="${esc(s.name)}&#10;${esc(s.kind || "no card")}${s.nsfw >= 2 ? " (nsfw)" : ""}${SIM.all ? " - " + esc(s.arch) : ""}&#10;look similarity ${s.score.toFixed(2)}">
        <img loading="lazy" src="/img?path=${encodeURIComponent(s.path)}&i=0" alt="">
        <div class="nm">${esc(s.name)}</div><div class="sc">${s.score.toFixed(2)}${SIM.all ? " &middot; " + esc(s.arch) : ""}</div></div>`).join("")}</div>`
      : `<div class="note plain">Nothing close with these filters.</div>`}`;
  box.querySelectorAll(".tog[data-k]").forEach(b => b.onclick = () => {
    const k = b.dataset.k; SIM[k] = !SIM[k]; remember("sim_" + k, SIM[k] ? "1" : "0"); drawSimilar(); });
  const listAll = () => { $("#q").value = `${likeWord}:"${CARD.name}"`; LAST_Q = $("#q").value; dropImage();
    if (DUPES) toggleDupes(false); if (LOOKS) { LOOKS = false; $("#looksbtn").classList.remove("on"); $("body").classList.remove("dupes"); } };
  $("#simlist").onclick = () => guarded(async () => { listAll(); await loadQueue(CARD.path); });
  box.querySelectorAll(".tile").forEach(t => t.onclick = () => guarded(async () => {
    const i = QUEUE.findIndex(q => q.path === t.dataset.path);
    if (i >= 0) { open(i); return; }
    listAll(); $("#status").value = "all"; await loadQueue(t.dataset.path); }));
}

(async () => {
  try { VOCAB = await api("/api/vocab"); await loadStyleStatus(); await loadShelves(); await loadQueue(); if (FOLDERS_OPEN) toggleFolders(true); }
  catch (e) { $("#main").innerHTML = `<div class="empty">Could not load: ${esc(e.message)}</div>`; }
})();
</script>
</body>
</html>
