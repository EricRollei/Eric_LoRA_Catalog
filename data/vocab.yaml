# LoRA card pick lists - the fixed words a card may use for each field.
#
# EDIT FREELY. Read by the card editor (run.py serve) and, later, the card writer.
#
#   facets:
#     <field>:
#       pick: one | many          one = a single choice, many = any number
#       help: shown in the editor
#       terms:
#         some_term: [alias, alias]       a term; its label is the id with _ as spaces.
#                                         Aliases are other words meaning the same (used to read old free text and
#                                         prompts). The label itself always counts.
#         a_group:                        a group is itself a pickable term (broad match),
#           _: [alias, alias]             its own aliases go under "_"
#           child_term: []                narrower terms; a prompt naming the group matches them all,
#                                         a prompt naming the child matches the child best.
#
# Renaming a term id after cards use it orphans those choices - add the old id as an alias of the new one instead.
# Words you type in the editor that are not here are kept on the card and listed by `run.py vocab-gaps`.

version: 1

facets:

  role:
    pick: many
    help: The job it does in a stack. style = the whole look; transform = changes content and composition but stacks on a style (surreal, dreamlike, glitch); treatment = a surface on top. Decides its slot and when it is applied (S1 / S2 / S3).
    terms:
      style: [base style, art style, artist style, look]
      transform: [transformation, reality bending, dreamlike transform, surreal transform, morph, glitch world]
      treatment: [overlay, finish, texture layer, process, linework layer, colour grade]
      detailer: [enhancer, detail, sharpener, quality, fixer, hands fix, realism boost]
      environment: [setting, background, location, place, room, scenery]
