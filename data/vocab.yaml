      subject: [character, person, creature, object, product, clothing, outfit, pose, action]
      layout: [composition, format, template, page layout, frame]
      utility: [tool, speed, turbo, lightning, distill, inpaint helper, control]
      slider: [dial, concept slider]

  family:
    pick: many
    help: Which group of styles it belongs to. Styles in the same family may stack as a blend (two comic styles); styles from different families clash unless pinned. Leave empty and the Suggester works it out from use / medium / rendering.
